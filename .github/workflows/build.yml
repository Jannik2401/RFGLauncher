name: Build and Release BetaLauncher

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'version.json'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: .NET installieren
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version in .csproj eintragen
        shell: pwsh
        run: |
          $ver = "1.0.${{ github.run_number }}"
          Write-Host "Setze Projekt-Version auf: $ver"
          
          $csprojPath = Get-ChildItem -Filter *.csproj | Select-Object -ExpandProperty FullName
          [xml]$csproj = Get-Content $csprojPath -Encoding UTF8

          $propGroup = $csproj.GetElementsByTagName("PropertyGroup")[0]
          if ($null -eq $propGroup) {
              $projectNode = $csproj.GetElementsByTagName("Project")[0]
              $propGroup = $csproj.CreateElement("PropertyGroup", $projectNode.NamespaceURI)
              $projectNode.AppendChild($propGroup)
          }

          foreach ($tagName in @("Version", "AssemblyVersion", "FileVersion")) {
              $node = $propGroup.GetElementsByTagName($tagName)[0]
              if ($null -eq $node) {
                  $node = $csproj.CreateElement($tagName, $propGroup.NamespaceURI)
                  $propGroup.AppendChild($node)
              }
              $node.InnerText = if ($tagName -eq "Version") { $ver } else { "$ver.0" }
          }

          $csproj.Save($csprojPath)

      - name: Launcher bauen
        shell: pwsh
        run: |
          $csprojPath = Get-ChildItem -Filter *.csproj | Select-Object -ExpandProperty Name
          dotnet publish $csprojPath -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:EnableCompressionInSingleFile=false -o ./publish

      - name: Release erstellen oder aktualisieren & EXE hochladen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: RFGlauncher (Version 1.0.${{ github.run_number }})
          body: "Automatisch aktualisiertes Release für den Launcher (Version 1.0.${{ github.run_number }})."
          files: ./publish/RFGlauncher.exe
          overwrite_files: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: version.json automatisch aktualisieren
        shell: pwsh
        run: |
          $ver = "1.0.${{ github.run_number }}"
          $json = @{
              version = "$ver"
              downloadUrl = "https://github.com/${{ github.repository }}/releases/download/latest/RFGlauncher.exe"
          } | ConvertTo-Json
          Set-Content -Path version.json -Value $json
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add version.json
          git commit -m "Auto-update version.json to $ver [skip ci]" || exit 0
          git pull origin main --rebase
          git push origin HEAD:main
